name: MiniOS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MiniOS and examples
        run: |
          make clean
          make

      - name: Run automated tests
        run: make test
